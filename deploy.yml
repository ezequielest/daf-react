name: Deploy React App to DreamHost
on:
push:
branches:
- main # Cambia a master si tu rama principal se llama así
jobs:
web-deploy:
name: Build and Deploy
runs-on: ubuntu-latest
steps:
# 1. Descargar el código del repositorio
- name: Checkout code
uses: actions/checkout@v4
# 2. Configurar Node.js en el entorno virtual
- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: '20' # Usa la versión de Node que requiera tu app
cache: 'npm'
# 3. Instalar dependencias y compilar la aplicación
- name: Install dependencies and Build
run: |
npm ci
npm run build
# 4. Sincronizar los archivos compilados con DreamHost mediante SFTP
- name: SFTP Deploy
uses: SamKirkland/FTP-Deploy-Action@v4.3.5
with:
server: ${{ secrets.FTP_SERVER }}
username: ${{ secrets.FTP_USERNAME }}
password: ${{ secrets.FTP_PASSWORD }}
port: 22 # DreamHost usa el puerto 22 para SFTP
local-dir: ./dist/ # Usa ./build/ si tu app fue creada con Create React App antigua
server-dir: /home/${{ secrets.FTP_USERNAME }}/dafequipamientos.com.ar # Ruta absoluta en tu servidor